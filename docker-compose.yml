services:
  kubesearch-mcp:
    build: .
    # image: ghcr.io/perfectra1n/kubesearch-mcp:latest  # or pull a published image
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      # MCP_HTTP_PORT defaults to 3000; leave it unset to honour an injected PORT.
      KUBESEARCH_REFRESH_HOURS: "24"
      # Log verbosity: debug | info | warn | error (default info).
      # LOG_LEVEL: info
      # Strongly recommended so background refreshes aren't rate-limited:
      # GITHUB_TOKEN: ${GITHUB_TOKEN}
      # Require a bearer token on every request (uncomment to enable auth).
      # Accepts one token or a comma-separated list, e.g. "tokenA,tokenB":
      # MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}
      # Restrict browser callers and guard against DNS rebinding:
      # MCP_ALLOWED_ORIGINS: https://app.example.com
      # MCP_ALLOWED_HOSTS: mcp.example.com
    volumes:
      - kubesearch-data:/data

volumes:
  kubesearch-data:
