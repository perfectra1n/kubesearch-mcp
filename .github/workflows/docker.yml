name: Build Docker image

# Branch and PR pushes build the rolling `latest`/`sha` images. Versioned images
# are cut by release-please.yml, which calls this workflow with the tag it just
# created — a `tags: ["v*"]` trigger would not fire for it, because GitHub does
# not run workflows on GITHUB_TOKEN-authored events.
on:
  push:
    branches: [master, main]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]
  workflow_call:
    inputs:
      tag:
        description: Tag to publish as a versioned image, e.g. v1.2.0
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish as a versioned image, e.g. v1.2.0
        required: false
        type: string
        default: ""

# Merging the release PR pushes to master, which starts a plain branch build at
# the same time release-please calls this workflow for the tag. Keying the group
# on the tag as well keeps those two runs from cancelling each other.
concurrency:
  group: docker-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Never publish an image that hasn't passed typecheck + tests.
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Empty on branch/PR builds, where checkout falls back to the
          # triggering ref; set on the release path so the image is built from
          # the tagged tree.
          ref: ${{ inputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only log in / push for events that aren't PRs from forks.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The semver patterns read `inputs.tag` rather than the git ref: on the
          # release path this workflow is called from a branch push, so the ref
          # is refs/heads/master and bare `type=semver` would extract nothing.
          # `enable=` switches them off entirely for branch/PR builds.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
