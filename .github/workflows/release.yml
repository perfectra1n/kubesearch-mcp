name: Release

# Publishes an already-tagged release: packs the npm tarball, attaches it to the
# GitHub Release, and pushes to npm.
#
# There is deliberately no `on: push: tags` trigger. release-please creates tags
# with the default GITHUB_TOKEN, and GitHub does not fire workflows from
# GITHUB_TOKEN-authored events — a tag trigger here would look correct and
# silently never run. release-please.yml calls this workflow instead; use the
# workflow_dispatch below to replay a release by hand.

on:
  workflow_call:
    inputs:
      tag:
        description: Tag to publish, e.g. v1.2.0
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, e.g. v1.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Build the tagged tree, not whatever master has drifted to since.
          ref: ${{ inputs.tag }}

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          # Pinned to the release that wrote .mise/mise.lock (see ci.yml).
          version: 2026.7.16
          install_args: --locked

      - name: Lint (typecheck, formatting, shell)
        run: mise run lint

      - name: Test
        run: mise run test

      # Near-tautological now that release-please bumps package.json in the same
      # commit it tags, but it still catches a hand-cut tag.
      - name: Check tag matches package.json version
        run: mise run version-check
        env:
          TAG: ${{ inputs.tag }}

      - name: Build and pack tarball
        run: mise run pack

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: "*.tgz"

  github-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: package

      # release-please already created the release and wrote its notes from the
      # changelog, so this only attaches the tarball. Generating notes here would
      # overwrite them.
      - name: Attach tarball to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" ./*.tgz --clobber

  npm-publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          # Pinned to the release that wrote .mise/mise.lock (see ci.yml).
          version: 2026.7.16
          install_args: --locked

      - name: Publish to npm
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret not set — skipping npm publish."
            exit 0
          fi
          # Reference the env var rather than the value, so the token is never
          # written to disk. prepublishOnly builds before publishing.
          # shellcheck disable=SC2016 # npm expands ${NODE_AUTH_TOKEN} itself
          echo '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > .npmrc
          npm ci
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
