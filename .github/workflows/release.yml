name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          # Pinned to match the version that wrote .mise/mise.lock (see ci.yml).
          version: 2026.7.10
          install_args: --locked

      - name: Lint (typecheck, formatting, shell)
        run: mise run lint

      - name: Test
        run: mise run test

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: mise run version-check

      - name: Build and pack tarball
        run: mise run pack

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: "*.tgz"

  github-release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: "*.tgz"
          prerelease: ${{ contains(github.ref_name, '-') }}

  npm-publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          # Pinned to match the version that wrote .mise/mise.lock (see ci.yml).
          version: 2026.7.10
          install_args: --locked

      - name: Publish to npm
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret not set — skipping npm publish."
            exit 0
          fi
          # Reference the env var rather than the value, so the token is never
          # written to disk. prepublishOnly builds before publishing.
          echo '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > .npmrc
          npm ci
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
